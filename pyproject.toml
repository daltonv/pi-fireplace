[project]
name = "pi-fireplace"
version = "0.1.0"
description = "A Raspberry Pi fireplace player and control API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio>=1.4.1.post1",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
